<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!--
    Favicon for LIGHT browser chrome.

    Fixed colours, unlike the in-app mark: a favicon renders on browser chrome
    the app cannot control, and the in-app mark's `currentColor` / logo-dim token
    resolve to nothing in a standalone document.

    Black measures 16.82:1 on a light tab. It is paired with icon-dark.svg via a
    `prefers-color-scheme` media query, because black is 1.10:1 on a dark one and
    would simply disappear there.

    NB: no double hyphen anywhere in this comment; that is illegal in XML.
  -->
  <circle cx="8" cy="8" r="6" fill="#0e0f12"/>
  <circle cx="24" cy="8" r="6" fill="#0e0f12"/>
  <circle cx="8" cy="24" r="6" fill="#0e0f12"/>
  <circle cx="24" cy="24" r="6" fill="#6f7681"/>
</svg>